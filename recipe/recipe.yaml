schema_version: 1

context:
  python_min: "3.12"
  version: "0.10.0"

package:
  name: fixbikenet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fixbikenet/fixbikenet-${{ version }}.tar.gz
  sha256: c73b492ad0da8549423f40441179b993e5da8c3178cbb980b6baabf2a0a90f96

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas >=1
    - matplotlib-base
    - osmnx >=2
    - geojson
    - tqdm
    - bikenetlib

tests:
  - python:
      imports:
        - fixbikenet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: BikeNetKit Python package to detect gaps in developed bicycle networks
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://bikenetkit.org/fixbikenet
  documentation: https://docs.bikenetkit.org/FixBikeNet
  repository: https://github.com/BikeNetKit/FixBikeNet

extra:
  recipe-maintainers:
    - mszell
